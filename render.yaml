services:
  - type: web
    name: tradebothub-mev-live-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: EXECUTION_MODE
        value: paper
      - key: LIVE_TRADING_ENABLED
        value: false
      - key: SIMULATE_ONLY
        value: false
      - key: CORS_ORIGIN
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: HELIUS_SENDER_URL
        value: http://ewr-sender.helius-rpc.com/fast
      - key: SIGNER_PRIVATE_KEY_BASE58
        sync: false
      - key: SIGNER_PRIVATE_KEY_JSON
        sync: false
      - key: JUPITER_API_KEY
        sync: false
      - key: TX_BROADCAST_MODE
        value: rpc
      - key: SWAP_SLIPPAGE_BPS
        value: 50
      - key: MAX_EXECUTION_USD
        value: 500
      - key: MAX_PRIORITY_FEE_LAMPORTS
        value: 1000000
      - key: SENDER_TIP_LAMPORTS
        value: 5000
      - key: DEMO_EXECUTION_ENABLED
        value: true
      - key: GUARDRAIL_KILL_SWITCH
        value: false
      - key: EXECUTION_COOLDOWN_MS
        value: 30000
      - key: MAX_DAILY_LOSS_USD
        value: 250
      - key: MAX_CONSECUTIVE_FAILURES
        value: 5
      - key: MAX_TOKEN_EXPOSURE_USD
        value: 1000
      - key: MAX_PRICE_IMPACT_PCT
        value: 1.5
      - key: MIN_QUOTE_OUT_USD
        value: 25
      - key: ADVANCED_PLANNER_LIMIT
        value: 12
      - key: FLASH_LOAN_MIN_NET_USD
        value: 15
      - key: FLASH_LOAN_MAX_BORROW_USD
        value: 25000
      - key: EVM_WALLET_EXECUTION_ENABLED
        value: true
      - key: TRADE_LEDGER_MAX_ENTRIES
        value: 500
      - key: TRADE_LEDGER_PATH
        value: /tmp/tradebothub-mev-runtime.json
      - key: EXECUTION_BLACKLIST_ASSETS
        sync: false
      - key: EXECUTION_BLACKLIST_DEXES
        sync: false
      - key: SKIP_PREFLIGHT
        value: false
      - key: POLL_INTERVAL_MS
        value: 15000
      - key: MIN_SPREAD_BPS
        value: 15
      - key: MAX_SPREAD_BPS
        value: 1200
      - key: MIN_PAIR_LIQUIDITY_USD
        value: 50000
      - key: MIN_OPPORTUNITY_CAPITAL_USD
        value: 250
      - key: MAX_PAIRS_PER_TOKEN
        value: 8
      - key: MAX_MEDIAN_DEVIATION_BPS
        value: 1500
      - key: DEFAULT_CAPITAL_USD
        value: 10000
      - key: ESTIMATED_COST_BPS
        value: 12
      - key: MAX_MARKET_ROWS
        value: 600
      - key: MAX_OPPORTUNITIES
        value: 250
      - key: SCANNER_CHAIN_IDS
        value: solana,ethereum,base,arbitrum,optimism,polygon,bsc,avalanche
      - key: SCANNER_ASSET_KEYS
        sync: false
